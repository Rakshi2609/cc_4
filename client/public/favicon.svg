<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="civicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#civicGrad)" filter="url(#shadow)" />
  <!-- Inner Subtle Border -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  
  <!-- C+ Lettermark -->
  <text x="200" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="220" fill="#ffffff" text-anchor="middle" letter-spacing="-8">C</text>
  
  <!-- Plus Sign with Glow -->
  <path d="M 330 220 L 330 280 M 300 250 L 360 250" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
</svg>
